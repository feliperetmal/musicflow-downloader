name: CI & Deploy MusicFlow to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL pública HTTPS do backend (ex: https://musicflow-worker.onrender.com)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Compilar pacote compartilhado
        run: npm --workspace=@musicflow/shared run build

      - name: Verificação de Tipos (Typecheck)
        run: npm run typecheck

      - name: Executar Testes Automatizados
        run: npm test

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Compilar Frontend Estático (Static Export)
        run: npm run build:static
        env:
          STATIC_EXPORT: 'true'
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_API_URL: ${{ inputs.api_url || vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_WORKER_URL }}

      - name: Auditoria de Segurança do Bundle Estático
        run: |
          if grep -rn "mf_worker_secret\|NEXT_PUBLIC_WORKER_SECRET\|SPOTIFY_CLIENT_SECRET" apps/web/out; then
            echo "ERRO DE SEGURANÇA: Referência a segredo administrativo detectada no bundle estático!"
            exit 1
          fi
          if grep -rn "http://localhost:4000" apps/web/out; then
            echo "ERRO: URL localhost:4000 detectada no bundle de produção!"
            exit 1
          fi
          echo "Auditoria de segurança do bundle aprovada (sem segredos nem localhost:4000)."

      - name: Upload de artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
